; Tennis ball machine firmware
; Build:      pio run -e esp32dev
; Flash USB:  pio run -e esp32dev -t upload
; Flash OTA:  pio run -e esp32dev_ota -t upload
; Host tests: pio test -e native

[env]
framework = arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"${sysenv.GITHUB_SHA}\"
lib_deps =
    madhephaestus/ESP32Servo
    bblanchon/ArduinoJson
    esp32async/ESPAsyncWebServer

; Same firmware, delivered over WiFi instead of USB
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ballmachine.local

; Pure logic compiled for your Mac — no hardware needed
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DUNIT_TEST
