; Tennis ball machine firmware
;
;   pio run -e esp32dev              build
;   pio run -e esp32dev -t upload    flash over USB
;   pio device monitor               serial console
;   pio test -e native               host-side unit tests


[platformio]
; a bare `pio run` builds only this, not every environment
default_envs = esp32dev


; ----------------------------------------------------------
;  ESP32 target — the real firmware
; ----------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    madhephaestus/ESP32Servo
;   uncomment these when you actually use them — each one
;   adds download time to a clean build
;   bblanchon/ArduinoJson
;   esp32async/ESPAsyncWebServer


; ----------------------------------------------------------
;  Same firmware, delivered over WiFi instead of USB.
;  Commented out until the machine is on the network and
;  running ArduinoOTA — before that it can only fail.
; ----------------------------------------------------------
; [env:esp32dev_ota]
; extends = env:esp32dev
; upload_protocol = espota
; upload_port = ballmachine.local


; ----------------------------------------------------------
;  Host target — pure logic tests, compiled for your Mac.
;
;  NOTE: deliberately has NO `framework` line and NO `board`.
;  Putting `framework = arduino` in a global [env] section is
;  what broke this before — it leaked into here, and a native
;  build has no board to compile against.
;
;  Run with `pio test -e native`, not `pio run`. It does
;  nothing until there are files in test/.
; ----------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DUNIT_TEST